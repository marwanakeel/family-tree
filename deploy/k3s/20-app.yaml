apiVersion: apps/v1
kind: Deployment
metadata:
  name: familytree
  namespace: familytree
spec:
  replicas: 1
  strategy:
    type: Recreate            # single writable hostPath — don't run two pods at once
  selector:
    matchLabels:
      app: familytree
  template:
    metadata:
      labels:
        app: familytree
    spec:
      containers:
        - name: web
          # Node backend + app (NO data/secrets baked in). Built for linux/amd64
          # and pushed to Docker Hub; k3s pulls it on first run, then caches.
          # Bump the tag every deploy (mutable tags don't re-pull with IfNotPresent).
          image: docker.io/marwanhefny/familytree:v3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8123
          readinessProbe:
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8123
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "192Mi"
              cpu: "300m"
          volumeMounts:
            - name: data
              mountPath: /data        # server.js reads+writes tree/users/sessions here
      volumes:
        - name: data
          # All mutable state lives on the node (NOT in the image):
          #   /mnt/Big Tank/containers/familytree/{family.json,users.json,
          #   sessions.json,config.local.json}
          # Must be WRITABLE (accounts + saved edits are persisted here).
          hostPath:
            path: "/mnt/Big Tank/containers/familytree"
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: familytree
  namespace: familytree
spec:
  type: NodePort                 # host cloudflared reaches it at <nodeIP>:30086
  selector:
    app: familytree
  ports:
    - port: 80
      targetPort: 8123
      nodePort: 30086            # dfsa uses 30085 — keep these distinct
