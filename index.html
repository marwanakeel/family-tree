<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>شجرة العائلة</title>
    <meta name="description" content="شجرة عائلة تفاعلية بسيطة وقابلة للمشاركة." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B3%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Amiri:wght@400;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header id="topbar">
      <div class="brand">
        <span class="logo">🌳</span>
        <div class="brand-text">
          <h1 id="appTitle">شجرة العائلة</h1>
          <p id="appStats" class="stats"></p>
        </div>
        <span id="modeBadge" class="badge">محلي</span>
      </div>

      <div class="search">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 21l-4.3-4.3M11 19a8 8 0 110-16 8 8 0 010 16z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="searchInput" type="search" data-i18n-ph="searchPlaceholder" placeholder="ابحث عن فرد…" autocomplete="off" />
        <div id="searchResults" class="search-results" hidden></div>
      </div>

      <div class="toolbar">
        <button id="btnAdd" class="primary">＋ <span class="lbl" data-i18n="add">فرد</span></button>
        <button id="btnHome" data-i18n-title="home" title="الرئيسية">🏠 <span class="lbl" data-i18n="home">الرئيسية</span></button>
        <button id="btnMode" data-i18n-title="toggleView" title="تبديل العرض">🎯 <span class="lbl" data-i18n="fullTree">كل الشجرة</span></button>
        <button id="btnFit" title="ملاءمة العرض">⤢ <span class="lbl" data-i18n="all">ملاءمة</span></button>
        <button id="btnReload" data-i18n-title="reloadFile" title="تحديث من الملف">↻ <span class="lbl" data-i18n="reloadFile">تحديث</span></button>
        <button id="btnExport" title="تنزيل ملف العائلة">⬇︎ <span class="lbl" data-i18n="export">تصدير</span></button>
        <button id="btnImport" title="فتح ملف عائلة">⬆︎ <span class="lbl" data-i18n="import">استيراد</span></button>
        <input id="fileInput" type="file" accept="application/json,.json" hidden />
        <button id="btnLang" class="lang" title="العربية / English">EN</button>
        <button id="btnHelp" class="icon" data-i18n-title="help" title="مساعدة">؟</button>
      </div>
    </header>

    <nav id="breadcrumbs" class="breadcrumbs" hidden></nav>

    <main id="stage">
      <svg id="tree" xmlns="http://www.w3.org/2000/svg" aria-label="شجرة العائلة"></svg>

      <div id="minimap" class="minimap" hidden>
        <canvas id="minimapCanvas" width="220" height="150"></canvas>
        <div id="minimapView" class="minimap-view"></div>
      </div>

      <div id="emptyState" hidden>
        <div style="font-size: 46px">🌱</div>
        <h2 data-i18n="emptyTitle">لا يوجد أفراد بعد</h2>
        <p data-i18n="emptyDesc">أضف أول فرد لتبدأ الشجرة.</p>
        <button id="btnAddEmpty" class="primary" data-i18n="addFirst">＋ أضف أول فرد</button>
      </div>

      <div class="zoom-controls">
        <button id="btnZoomIn" title="تكبير">＋</button>
        <button id="btnZoomOut" title="تصغير">－</button>
        <button id="btnFit2" title="عرض الكل">⤢</button>
      </div>

      <div class="legend">
        <span><i class="male"></i> <b data-i18n="male">ذكر</b></span>
        <span><i class="female"></i> <b data-i18n="female">أنثى</b></span>
      </div>
    </main>

    <aside id="panel" class="panel" aria-live="polite"></aside>
    <div id="scrim" hidden></div>

    <dialog id="helpDialog">
      <div class="dlg-body">
        <h2 data-i18n="helpTitle">🌳 شجرة عائلتك</h2>
        <ul id="helpList"></ul>
        <p class="hint">⌨︎ <kbd>+</kbd>/<kbd>−</kbd> · <kbd>F</kbd> · <kbd>Esc</kbd></p>
      </div>
      <div class="dlg-actions"><button id="btnHelpClose" class="primary" data-i18n="got">تمام</button></div>
    </dialog>

    <div id="toast" class="toast" role="status"></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
