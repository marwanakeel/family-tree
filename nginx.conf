server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Family data is mounted from the host at /data (NOT baked into the image),
    # so updating the tree is just replacing /data/family.json — no rebuild.
    location = /family.json {
        alias /data/family.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }
    # Optional runtime config (edit password etc.) — also node-mounted, never in
    # the image. Absent file -> 404 -> the app quietly uses its defaults.
    location = /config.local.json {
        alias /data/config.local.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }
    location ~* \.(?:js|mjs|css|html)$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
